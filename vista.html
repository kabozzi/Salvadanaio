<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#cfe3dc" />
<title>Il salvadanaio</title>
<style>
  :root {
    --sfondo: #cfe3dc; --carta: #fdf9f0; --inchiostro: #23332f; --mela: #5b9a31;
    --zucca: #efa022; --zucca-chiaro: #f8c96f; --lampone: #c33f66; --grigio: #a9bcb5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--sfondo); }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", Nunito,
      "Trebuchet MS", system-ui, sans-serif;
    color: var(--inchiostro); user-select: none;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }

  /* Il palco ha dimensioni fisse: viene scalato da JS per entrare nello schermo. */
  #palco {
    position: absolute; top: 0; left: 0; width: 1280px; height: 620px;
    transform-origin: top left; display: flex; flex-direction: column;
    padding: 14px 18px; gap: 12px;
  }

  .testa { display: flex; align-items: center; gap: 14px; flex: none; height: 64px; }
  .titolo { font-size: 34px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
  .spia { width: 13px; height: 13px; border-radius: 50%; background: var(--grigio); flex: none; }
  .spia.ok { background: var(--mela); }
  .spia.giu { background: var(--lampone); }
  .riempi { flex: 1; }
  .nav { display: flex; align-items: center; gap: 14px; flex: none; }
  .nav button {
    font: inherit; color: inherit; background: var(--carta); cursor: pointer;
    border: 4px solid var(--inchiostro); border-radius: 50%;
    width: 58px; height: 58px; font-size: 30px; line-height: 1;
  }
  .nav button:active { background: var(--zucca-chiaro); }
  .giorno { font-size: 30px; font-weight: 700; text-align: center; min-width: 300px;
            white-space: nowrap; }
  .oggi { display: inline-block; margin-left: 10px; padding: 3px 12px; font-size: 18px;
          font-weight: 700; background: var(--zucca-chiaro); border-radius: 10px;
          vertical-align: middle; }

  .corpo { flex: 1; min-height: 0; display: flex; gap: 18px; }
  .riquadro { background: var(--carta); border: 4px solid var(--inchiostro);
              border-radius: 26px; padding: 18px; min-height: 0; }

  .sinistra { flex: 0 0 360px; display: flex; flex-direction: column;
              align-items: center; justify-content: space-between; }
  .barattolo { height: 190px; width: auto; flex: none; }
  .euro { font-size: 66px; font-weight: 800; line-height: 1; letter-spacing: -0.03em;
          font-variant-numeric: tabular-nums; }
  .gettoni { font-size: 19px; opacity: .7; text-align: center; line-height: 1.3; }
  .barra { width: 100%; height: 18px; border: 3px solid var(--inchiostro);
           border-radius: 10px; background: #fff; flex: none; }
  .barra span { display: block; height: 100%; background: var(--mela); border-radius: 7px; }
  .strip { display: flex; gap: 6px; width: 100%; flex: none; }
  .cella {
    flex: 1; border: 3px solid var(--inchiostro); border-radius: 12px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 7px 0; cursor: pointer; font: inherit; color: inherit; min-width: 0;
  }
  .cella small { font-size: 13px; font-weight: 700; opacity: .55; }
  .cella b { font-size: 19px; }
  .cella.piena { background: var(--mela); color: #fff; }
  .cella.piena small { opacity: .85; }
  .cella.parziale { background: var(--zucca-chiaro); }
  .cella.futuro, .cella.libero { border-color: var(--grigio); color: var(--grigio); }
  .cella.libero { background: transparent; border-style: dashed; }
  .cella.scelta { box-shadow: 0 0 0 5px var(--zucca); }

  .destra { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .lista { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .voce {
    display: flex; align-items: center; gap: 18px; flex: 1 1 0; min-height: 0;
    padding: 0 20px; background: #fff; border: 4px solid var(--inchiostro);
    border-radius: 18px;
  }
  .voce.fatta { background: #edf6e6; border-color: var(--mela); }
  .segno {
    flex: none; width: 42px; height: 42px; border: 4px solid var(--inchiostro);
    border-radius: 11px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; color: transparent;
  }
  .voce.fatta .segno { background: var(--mela); border-color: var(--mela); color: #fff; }
  .voce .testo { flex: 1; font-size: 27px; min-width: 0; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
  .voce b { font-size: 27px; color: var(--mela); flex: none; }
  .voce.fatta .testo { opacity: .6; }

  .capricci { flex: none; border-top: 3px dotted var(--grigio); padding-top: 10px;
              display: flex; flex-direction: column; gap: 5px; }
  .capricci h2 { font-size: 15px; font-weight: 800; opacity: .5;
                 text-transform: uppercase; letter-spacing: .06em; }
  .capriccio { display: flex; align-items: center; gap: 14px; font-size: 22px; }
  .capriccio .testo { flex: 1; min-width: 0; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; }
  .capriccio b { color: var(--lampone); font-weight: 800; flex: none; }
  .pulito { font-size: 22px; color: var(--mela); font-weight: 700; }
  .avviso { flex: 1; display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 26px; line-height: 1.5; padding: 0 40px; opacity: .8; }
</style>
</head>
<body>
<div id="palco"></div>

<script type="module">
/* Vista sola lettura del salvadanaio per lo schermo orizzontale dell'Echo Show.
   Non scrive mai su Firestore: apre solo un ascolto sul documento condiviso.
   Il layout e' disegnato a 1280x620 e scalato per entrare nell'area visibile,
   perche' su Silk le unita' vh non corrispondono all'area davvero visibile. */

const FIREBASE = {
  apiKey: "AIzaSyDOI65LLcL0Ts0cqklgbutOQAF88e_X0X4",
  authDomain: "salvadanaio-a9f1f.firebaseapp.com",
  projectId: "salvadanaio-a9f1f",
  appId: "1:703648579083:web:60345e8c8f48056f1a110e",
};
const VERSIONE_SDK = "10.12.2";
const CHIAVE_PASS = "paghetta_pass_v1";
const RITORNO_A_OGGI = 90000;
const LARG = 1280, ALT = 620;

const DOW = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
const DOW_MINI = ["L", "M", "M", "G", "V", "S", "D"];
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
  "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

const due = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
const daIso = (s) => { const [a, m, g] = s.split("-").map(Number); return new Date(a, m - 1, g); };
const piu = (s, n) => { const d = daIso(s); d.setDate(d.getDate() + n); return iso(d); };
const lunedi = (s) => { const d = daIso(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const eur = (n) => (Number.isFinite(n) ? n : 0).toLocaleString("it-IT", { style: "currency", currency: "EUR" });
const attivoIn = (d, modo) => (modo === "feriali" ? d.getDay() >= 1 && d.getDay() <= 5 : true);
/* Giorni in cui vale un'attivita', in numerazione getDay(). Chi non ha il campo vale sempre. */
const giorniDi = (a) => (Array.isArray(a.giorni) ? a.giorni : [0, 1, 2, 3, 4, 5, 6]);
const attivaIl = (a, dow) => giorniDi(a).includes(dow);
const gettoniIl = (config, dow) => config.attivita.reduce(
  (s, x) => s + (attivaIl(x, dow) ? Number(x.gettoni || 0) : 0), 0);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function impronta(testo) {
  const pulito = testo.trim().toLowerCase().replace(/\s+/g, " ");
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("paghetta:" + pulito));
    return Array.from(new Uint8Array(buf)).map((b) => due(b.toString(16))).join("").slice(0, 28);
  } catch (e) {
    let h = 5381;
    for (const c of pulito) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
    return "l" + h.toString(16);
  }
}

const palco = document.getElementById("palco");
let dati = null;
let sel = iso(new Date());
let rete = "giu";
let timerOggi = null;

/* Misura l'area davvero disponibile e scala il palco per farci stare tutto. */
function adatta() {
  const vv = window.visualViewport;
  const larghezza = Math.min(
    document.documentElement.clientWidth || Infinity,
    window.innerWidth || Infinity,
    vv ? vv.width : Infinity
  );
  const altezza = Math.min(
    document.documentElement.clientHeight || Infinity,
    window.innerHeight || Infinity,
    vv ? vv.height : Infinity
  );
  if (!isFinite(larghezza) || !isFinite(altezza) || larghezza < 50 || altezza < 50) return;
  const k = Math.min(larghezza / LARG, altezza / ALT);
  palco.style.transform =
    `translate(${(larghezza - LARG * k) / 2}px, ${(altezza - ALT * k) / 2}px) scale(${k})`;
}

const barattolo = (pieno) => {
  const p = Math.max(0, Math.min(1, pieno || 0));
  const cima = 124 - p * 88;
  const sagoma = "M26,46 Q26,32 42,32 L88,32 Q104,32 104,46 L104,120 Q104,134 88,134 L42,134 Q26,134 26,120 Z";
  return `<svg class="barattolo" viewBox="0 0 130 150" aria-hidden="true">
    <defs><clipPath id="cl"><path d="${sagoma}"/></clipPath></defs>
    <rect x="38" y="14" width="54" height="18" rx="7" fill="var(--zucca)"
      stroke="var(--inchiostro)" stroke-width="3"/>
    <rect x="57" y="20" width="16" height="6" rx="3" fill="var(--inchiostro)"/>
    <g clip-path="url(#cl)">
      <rect x="20" y="0" width="90" height="150" fill="#fff"/>
      ${p > 0.01 ? `<rect x="20" y="${cima}" width="90" height="150" fill="var(--zucca)"/>
        <ellipse cx="65" cy="${cima}" rx="45" ry="7" fill="var(--zucca-chiaro)"/>` : ""}
    </g>
    <path d="${sagoma}" fill="none" stroke="var(--inchiostro)" stroke-width="3.5" stroke-linejoin="round"/>
  </svg>`;
};

function calcola() {
  const { config, registro } = dati;
  const oggi = iso(new Date());
  const inizio = lunedi(sel);
  let attivi = 0, fatti = 0, persi = 0, massimo = 0;
  const giorni = [];
  for (let i = 0; i < 7; i++) {
    const chiave = piu(inizio, i);
    const data = daIso(chiave);
    const dow = data.getDay();
    const att = attivoIn(data, config.giorni);
    const maxG = gettoniIl(config, dow);
    const rec = registro[chiave] || {};
    const fattiG = config.attivita.reduce(
      (s, x) => s + (attivaIl(x, dow) && rec.fatte && rec.fatte[x.id]
        ? Number(x.gettoni || 0) : 0), 0);
    const capG = config.capricci.reduce(
      (s, x) => s + ((rec.capricci && rec.capricci[x.id]) || 0) * Number(x.gettoni || 0), 0);
    if (att) { attivi += 1; fatti += fattiG; massimo += maxG; }
    persi += capG;
    giorni.push({ chiave, att, maxG, fattiG, capG, futuro: chiave > oggi });
  }
  const netti = Math.max(0, fatti - persi);
  return {
    giorni, massimo, netti,
    valore: massimo > 0 ? Number(config.importoSettimanale || 0) / massimo : 0,
  };
}

function disegna() {
  const spia = `<i class="spia ${rete}"></i>`;

  if (!dati) {
    palco.innerHTML = `<div class="testa"><span class="titolo">Il salvadanaio</span>${spia}</div>
      <div class="corpo"><div class="riquadro destra"><p class="avviso">
      ${rete === "senzaparola"
        ? "Apri prima la pagina principale su questo schermo e inserisci la parola di famiglia."
        : "Sto aprendo il salvadanaio\u2026"}</p></div></div>`;
    adatta();
    return;
  }

  const c = calcola();
  const d = daIso(sel);
  const rec = dati.registro[sel] || { fatte: {}, capricci: {} };
  const persiOggi = dati.config.capricci.reduce(
    (s, x) => s + ((rec.capricci && rec.capricci[x.id]) || 0) * Number(x.gettoni || 0), 0);
  const pieno = c.massimo > 0 ? c.netti / c.massimo : 0;

  palco.innerHTML = `
    <div class="testa">
      <span class="titolo">${dati.config.nome ? `Il salvadanaio di ${esc(dati.config.nome)}` : "Il salvadanaio"}</span>
      ${spia}
      <span class="riempi"></span>
      <div class="nav">
        <button data-g="-1" aria-label="Giorno precedente">&lsaquo;</button>
        <span class="giorno">${DOW[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}
          ${sel === iso(new Date()) ? '<span class="oggi">oggi</span>' : ""}</span>
        <button data-g="1" aria-label="Giorno successivo">&rsaquo;</button>
      </div>
    </div>

    <div class="corpo">
      <div class="riquadro sinistra">
        ${barattolo(pieno)}
        <div class="euro">${eur(c.netti * c.valore)}</div>
        <div class="gettoni">${c.netti} gettoni su ${c.massimo}<br>questa settimana</div>
        <div class="barra"><span style="width:${Math.min(100, pieno * 100)}%"></span></div>
        <div class="strip">
          ${c.giorni.map((g, i) => {
            const st = !g.att ? "libero" : g.futuro ? "futuro"
              : g.maxG > 0 && g.fattiG === g.maxG ? "piena"
              : g.fattiG > 0 ? "parziale" : "vuota";
            return `<button class="cella ${st} ${g.chiave === sel ? "scelta" : ""}" data-d="${g.chiave}">
              <small>${DOW_MINI[i]}</small><b>${daIso(g.chiave).getDate()}</b></button>`;
          }).join("")}
        </div>
      </div>

      <div class="riquadro destra">
        <div class="lista">
          ${(() => {
            const diOggi = dati.config.attivita.filter((a) => attivaIl(a, d.getDay()));
            if (diOggi.length === 0)
              return '<div class="avviso">Oggi nessun compito</div>';
            return diOggi.map((a) => {
              const ok = !!(rec.fatte && rec.fatte[a.id]);
              return `<div class="voce ${ok ? "fatta" : ""}">
                <span class="segno">\u2713</span>
                <span class="testo">${esc(a.testo)}</span>
                <b>+${a.gettoni}</b>
              </div>`;
            }).join("");
          })()}
        </div>
        <div class="capricci">
          <h2>Capricci</h2>
          ${persiOggi === 0
            ? '<div class="pulito">Nessuno oggi, bene cos\u00ec</div>'
            : dati.config.capricci
                .map((x) => ({ t: x.testo, n: (rec.capricci && rec.capricci[x.id]) || 0, g: Number(x.gettoni || 0) }))
                .filter((r) => r.n > 0)
                .map((r) => `<div class="capriccio"><span class="testo">${esc(r.t)}</span>
                  <b>${r.n > 1 ? r.n + " \u00d7 " : ""}\u2212${r.n * r.g}</b></div>`)
                .join("")}
        </div>
      </div>
    </div>`;
  adatta();
}

palco.addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-g], button[data-d]");
  if (!b) return;
  if (b.dataset.g) sel = piu(sel, Number(b.dataset.g));
  else sel = b.dataset.d;
  disegna();
  clearTimeout(timerOggi);
  timerOggi = setTimeout(() => { sel = iso(new Date()); disegna(); }, RITORNO_A_OGGI);
});

window.addEventListener("resize", adatta);
window.addEventListener("orientationchange", adatta);
if (window.visualViewport) window.visualViewport.addEventListener("resize", adatta);
setTimeout(adatta, 300);
setTimeout(adatta, 1200);
setInterval(() => { if (dati) disegna(); }, 60000);

(async () => {
  const parola = localStorage.getItem(CHIAVE_PASS);
  if (!parola) { rete = "senzaparola"; disegna(); return; }
  disegna();
  try {
    const base = `https://www.gstatic.com/firebasejs/${VERSIONE_SDK}`;
    const [{ initializeApp }, { getAuth, signInAnonymously }, fs] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`),
    ]);
    const app = initializeApp(FIREBASE);
    await signInAnonymously(getAuth(app));
    const db = fs.getFirestore(app);
    const rif = fs.doc(db, "paghette", await impronta(parola));
    fs.onSnapshot(rif, (istantanea) => {
      rete = "ok";
      if (istantanea.exists()) {
        const g = istantanea.data();
        const cfg = g.config || {};
        dati = {
          config: {
            nome: cfg.nome || "",
            importoSettimanale: cfg.importoSettimanale || 0,
            giorni: cfg.giorni || "tutti",
            attivita: Array.isArray(cfg.attivita) ? cfg.attivita : [],
            capricci: Array.isArray(cfg.capricci) ? cfg.capricci : [],
          },
          registro: g.registro || {},
        };
      }
      disegna();
    }, () => { rete = "giu"; disegna(); });
  } catch (e) {
    rete = "giu";
    disegna();
  }
})();
</script>
</body>
</html>
