<body>
<div id="app"><p class="pg-boot">Apro il salvadanaio…</p></div>
<script type="module">
/* ------------------------------------------------------------------
   1. CONFIGURAZIONE — l'unica parte da modificare a mano.
   Lasciando apiKey vuota l'app funziona in locale su questo
   dispositivo (localStorage), senza sincronizzazione.
------------------------------------------------------------------ */
const FIREBASE = {
  apiKey: "AIzaSyDOI65LLcL0Ts0cqklgbutOQAF88e_X0X4",
  authDomain: "salvadanaio-a9f1f.firebaseapp.com",
  projectId: "salvadanaio-a9f1f",
  appId: "1:703648579083:web:60345e8c8f48056f1a110e",
};

const VERSIONE_SDK = "10.12.2";
const CHIAVE_LOCALE = "paghetta_dati_v1";
const CHIAVE_PASS = "paghetta_pass_v1";

const CONFIG_INIZIALE = {
  nome: "",
  importoSettimanale: 2.5,
  giorni: "tutti",
  attivita: [
    { id: "a1", testo: "Rifare il letto", gettoni: 1, giorni: [0, 1, 2, 3, 4, 5, 6] },
    { id: "a2", testo: "Sparecchiare la tavola", gettoni: 1, giorni: [0, 1, 2, 3, 4, 5, 6] },
    { id: "a3", testo: "Rimettere a posto i giochi", gettoni: 1, giorni: [0, 1, 2, 3, 4, 5, 6] },
    { id: "a4", testo: "Preparare lo zaino", gettoni: 1, giorni: [1, 2, 3, 4, 5] },
  ],
  capricci: [
    { id: "c1", testo: "Piange o urla per ottenere qualcosa", gettoni: 2 },
    { id: "c2", testo: "Risponde male", gettoni: 2 },
    { id: "c3", testo: "Scenata per i compiti", gettoni: 3 },
  ],
};

/* ------------------------------------------------------------------
   2. UTILITÀ
------------------------------------------------------------------ */
const DOW = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
const DOW_MINI = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno",
  "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

const uid = () => Math.random().toString(36).slice(2, 8);
const due = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${due(d.getMonth() + 1)}-${due(d.getDate())}`;
const daIso = (s) => { const [a, m, g] = s.split("-").map(Number); return new Date(a, m - 1, g); };
const piu = (s, n) => { const d = daIso(s); d.setDate(d.getDate() + n); return iso(d); };
const lunedi = (s) => { const d = daIso(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const eur = (n) => (Number.isFinite(n) ? n : 0).toLocaleString("it-IT", { style: "currency", currency: "EUR" });
const attivoIn = (d, modo) => (modo === "feriali" ? d.getDay() >= 1 && d.getDay() <= 5 : true);
/* Giorni in cui vale un'attivita', in numerazione getDay(): 0 domenica ... 6 sabato.
   Le attivita' salvate prima di questa funzione non hanno il campo: valgono sempre. */
const DOW_LET = ["D", "L", "M", "M", "G", "V", "S"];
const ORDINE_DOW = [1, 2, 3, 4, 5, 6, 0];
const giorniDi = (a) => (Array.isArray(a.giorni) ? a.giorni : [0, 1, 2, 3, 4, 5, 6]);
const attivaIl = (a, dow) => giorniDi(a).includes(dow);
const gettoniIl = (config, dow) => config.attivita.reduce(
  (s, x) => s + (attivaIl(x, dow) ? Number(x.gettoni || 0) : 0), 0);
const gettoniLabel = (n) => `${n} ${n === 1 ? "gettone" : "gettoni"}`;
const breve = (s) => { const d = daIso(s); return `${d.getDate()} ${MESI[d.getMonth()].slice(0, 3)}`; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function impronta(testo) {
  const pulito = testo.trim().toLowerCase().replace(/\s+/g, " ");
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("paghetta:" + pulito));
    return Array.from(new Uint8Array(buf)).map((b) => due(b.toString(16))).join("").slice(0, 28);
  } catch (e) {
    let h = 5381;
    for (const c of pulito) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
    return "l" + h.toString(16);
  }
}

/* ------------------------------------------------------------------
   3. STATO E PERSISTENZA
------------------------------------------------------------------ */
const vista = { tab: "oggi", sel: iso(new Date()), sbloccato: false, avviso: "", rete: "locale" };
const QUIZ = { a: 6 + Math.floor(Math.random() * 4), b: 6 + Math.floor(Math.random() * 4) };
let dati = null;
let ultimoInvio = "";
let scriviRemoto = null;

const normalizza = (grezzo) => {
  const c = { ...CONFIG_INIZIALE, ...((grezzo && grezzo.config) || {}) };
  if (grezzo && grezzo.config && grezzo.config.importoMensile && !grezzo.config.importoSettimanale) {
    c.importoSettimanale = Math.round((grezzo.config.importoMensile / 4.33) * 100) / 100;
  }
  delete c.importoMensile;
  if (!Array.isArray(c.attivita)) c.attivita = [];
  if (!Array.isArray(c.capricci)) c.capricci = [];
  return { config: c, registro: (grezzo && grezzo.registro) || {}, paghe: (grezzo && grezzo.paghe) || {} };
};

function salva(prossimo) {
  dati = prossimo;
  disegna();
  const testo = JSON.stringify(prossimo);
  localStorage.setItem(CHIAVE_LOCALE, testo);
  if (!scriviRemoto) return;
  ultimoInvio = testo;
  scriviRemoto(prossimo).then(
    () => { if (vista.avviso) { vista.avviso = ""; disegna(); } },
    () => { vista.avviso = "Modifica salvata solo su questo dispositivo: nessuna connessione."; disegna(); }
  );
}

const patchConfig = (patch) => salva({ ...dati, config: { ...dati.config, ...patch } });

function patchGiorno(chiave, fn) {
  const a = dati.registro[chiave] || { fatte: {}, capricci: {} };
  const nuovo = fn({ fatte: { ...a.fatte }, capricci: { ...a.capricci } });
  salva({ ...dati, registro: { ...dati.registro, [chiave]: nuovo } });
}

function collega(remoto) {
  const testo = JSON.stringify(remoto);
  if (testo === ultimoInvio) return;
  const attivo = document.activeElement;
  if (attivo && (attivo.tagName === "INPUT" || attivo.tagName === "SELECT")) return;
  dati = normalizza(remoto);
  disegna();
}

/* ------------------------------------------------------------------
   4. CALCOLO DELLA SETTIMANA
------------------------------------------------------------------ */
function calcola() {
  const { config, registro } = dati;
  const oggi = iso(new Date());
  const settimana = (inizio) => {
    let giorniAttivi = 0, fatti = 0, penalita = 0, ancora = 0, perfetti = 0, massimo = 0;
    const giorni = [];
    for (let i = 0; i < 7; i++) {
      const chiave = piu(inizio, i);
      const data = daIso(chiave);
      const dow = data.getDay();
      const att = attivoIn(data, config.giorni);
      const maxG = gettoniIl(config, dow);
      const rec = registro[chiave] || {};
      const fattiG = config.attivita.reduce(
        (s, x) => s + (attivaIl(x, dow) && rec.fatte && rec.fatte[x.id]
          ? Number(x.gettoni || 0) : 0), 0);
      const capG = config.capricci.reduce(
        (s, x) => s + ((rec.capricci && rec.capricci[x.id]) || 0) * Number(x.gettoni || 0), 0);
      if (att) {
        giorniAttivi++;
        massimo += maxG;
        fatti += fattiG;
        if (chiave > oggi) ancora += maxG;
        else if (chiave === oggi) ancora += Math.max(0, maxG - fattiG);
        if (maxG > 0 && fattiG === maxG && capG === 0 && chiave <= oggi) perfetti++;
      }
      penalita += capG;
      giorni.push({ chiave, att, maxG, fattiG, capG, futuro: chiave > oggi, oggi: chiave === oggi });
    }
    const valore = massimo > 0 ? Number(config.importoSettimanale || 0) / massimo : 0;
    const netti = Math.max(0, fatti - penalita);
    return {
      inizio, fine: piu(inizio, 6), giorni, giorniAttivi, massimo, valore,
      fatti, penalita, netti, perfetti,
      potenziale: Math.min(massimo, netti + ancora),
      euro: netti * valore,
      chiusa: piu(inizio, 6) < oggi,
      corrente: inizio === lunedi(oggi),
    };
  };

  const storico = [];
  for (let i = 1; i <= 6; i++) {
    const s = settimana(piu(lunedi(oggi), -7 * i));
    if (s.fatti > 0 || s.penalita > 0) storico.push(s);
  }
  return { set: settimana(lunedi(vista.sel)), storico };
}

/* ------------------------------------------------------------------
   5. DISEGNO
------------------------------------------------------------------ */
function barattolo(pieno) {
  const p = Math.max(0, Math.min(1, pieno || 0));
  const cima = 124 - p * 88;
  const sagoma = "M26,46 Q26,32 42,32 L88,32 Q104,32 104,46 L104,120 Q104,134 88,134 L42,134 Q26,134 26,120 Z";
  return `<svg class="pg-barattolo" viewBox="0 0 130 150" role="img"
    aria-label="Salvadanaio pieno al ${Math.round(p * 100)} per cento">
    <defs><clipPath id="pg-clip"><path d="${sagoma}"/></clipPath></defs>
    <rect x="38" y="14" width="54" height="18" rx="7" fill="var(--zucca)"
      stroke="var(--inchiostro)" stroke-width="3"/>
    <rect x="57" y="20" width="16" height="6" rx="3" fill="var(--inchiostro)"/>
    <g clip-path="url(#pg-clip)">
      <rect x="20" y="0" width="90" height="150" fill="var(--carta)"/>
      ${p > 0.01 ? `<rect x="20" y="${cima}" width="90" height="150" fill="var(--zucca)"/>
        <ellipse cx="65" cy="${cima}" rx="45" ry="7" fill="var(--zucca-chiaro)"/>` : ""}
    </g>
    <path d="${sagoma}" fill="none" stroke="var(--inchiostro)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M38,60 Q34,80 36,104" fill="none" stroke="var(--carta)" stroke-width="4"
      stroke-linecap="round" opacity="0.7"/>
  </svg>`;
}

function editor(titolo, voci, campo, segno, placeholder) {
  return `<div class="pg-editor"><h2>${titolo}</h2>
    ${voci.map((v) => `<div class="pg-editor-voce">
      <div class="pg-editor-riga">
        <input type="text" value="${esc(v.testo)}" placeholder="${placeholder}"
          data-campo="${campo}" data-id="${v.id}" data-chiave="testo" />
        <span class="pg-segno">${segno}</span>
        <input class="pg-num" type="number" min="1" max="20" value="${v.gettoni}"
          data-campo="${campo}" data-id="${v.id}" data-chiave="gettoni" />
        <button class="pg-elimina" data-az="togli" data-campo="${campo}" data-id="${v.id}"
          aria-label="Togli riga">×</button>
      </div>
      ${campo === "attivita" ? `<div class="pg-giorni">
        ${ORDINE_DOW.map((dw) => `<button data-az="dow" data-id="${v.id}" data-n="${dw}"
          class="${attivaIl(v, dw) ? "on" : ""}"
          aria-label="${DOW[dw]}">${DOW_LET[dw]}</button>`).join("")}
      </div>` : ""}
    </div>`).join("")}
    <button class="pg-aggiungi" data-az="aggiungi" data-campo="${campo}">Aggiungi una riga</button>
  </div>`;
}

function pannelloGiorno(c) {
  const { config, registro } = dati;
  const sel = vista.sel;
  const d = daIso(sel);
  const rec = registro[sel] || { fatte: {}, capricci: {} };
  const fatti = config.attivita.reduce(
    (s, x) => s + (attivaIl(x, d.getDay()) && rec.fatte && rec.fatte[x.id]
      ? Number(x.gettoni || 0) : 0), 0);
  const persi = config.capricci.reduce(
    (s, x) => s + ((rec.capricci && rec.capricci[x.id]) || 0) * Number(x.gettoni || 0), 0);

  return `<div class="pg-pannello">
    <div class="pg-datebar">
      <button data-az="giorno" data-n="-1" aria-label="Giorno precedente">‹</button>
      <div><strong>${DOW[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}</strong>
        ${sel === iso(new Date()) ? '<span class="pg-oggi-tag">oggi</span>' : ""}</div>
      <button data-az="giorno" data-n="1" aria-label="Giorno successivo">›</button>
    </div>
    ${attivoIn(d, config.giorni) ? "" :
      '<p class="pg-libero">Giorno libero: non conta per la paghetta.</p>'}
    <ul class="pg-lista">
      ${config.attivita.length === 0
        ? '<li class="pg-vuoto">Nessuna attività. Aggiungile in Regole.</li>'
        : (() => {
            const diOggi = config.attivita.filter((a) => attivaIl(a, d.getDay()));
            if (diOggi.length === 0)
              return '<li class="pg-vuoto">Nessun compito previsto in questo giorno.</li>';
            return diOggi.map((a) => {
              const ok = !!(rec.fatte && rec.fatte[a.id]);
              return `<li><button class="pg-voce ${ok ? "fatta" : ""}" data-az="spunta" data-id="${a.id}">
                <span class="pg-box" aria-hidden="true">${ok ? "✓" : ""}</span>
                <span class="pg-voce-testo">${esc(a.testo)}</span>
                <span class="pg-premio">+${a.gettoni}</span>
              </button></li>`;
            }).join("");
          })()}
    </ul>
    <div class="pg-capricci"><h2>Capricci</h2>
      ${config.capricci.map((x) => {
        const n = (rec.capricci && rec.capricci[x.id]) || 0;
        return `<div class="pg-cap-riga">
          <span class="pg-cap-testo">${esc(x.testo)}</span>
          <span class="pg-costo">−${x.gettoni}</span>
          <div class="pg-contatore">
            <button data-az="cap" data-id="${x.id}" data-n="-1" ${n === 0 ? "disabled" : ""}
              aria-label="Togli">−</button>
            <b class="${n > 0 ? "acceso" : ""}">${n}</b>
            <button data-az="cap" data-id="${x.id}" data-n="1" aria-label="Aggiungi">+</button>
          </div></div>`;
      }).join("")}
    </div>
    <p class="pg-bilancio">Bilancio del giorno:
      <b>${fatti - persi > 0 ? "+" : ""}${fatti - persi}</b>
      (${fatti} guadagnati, ${persi} persi)</p>
  </div>`;
}

function pannelloSettimana(c) {
  const s = c.set;
  const pagata = !!dati.paghe[s.inizio];
  return `<div class="pg-pannello">
    <div class="pg-datebar">
      <button data-az="sett" data-n="-7" aria-label="Settimana precedente">‹</button>
      <div><strong>${breve(s.inizio)} – ${breve(s.fine)}</strong></div>
      <button data-az="sett" data-n="7" aria-label="Settimana successiva">›</button>
    </div>
    <div class="pg-strip">
      ${s.giorni.map((g, i) => {
        const st = !g.att ? "libero" : g.futuro ? "futuro"
          : g.maxG > 0 && g.fattiG === g.maxG ? "piena"
          : g.fattiG > 0 ? "parziale" : "vuota";
        return `<button class="pg-cella ${st} ${g.oggi ? "adesso" : ""} ${g.chiave === vista.sel ? "scelta" : ""}"
          data-az="vai" data-d="${g.chiave}">
          <small>${DOW_MINI[i]}</small><b>${daIso(g.chiave).getDate()}</b>
          ${g.att && !g.futuro ? `<em>${g.fattiG}/${g.maxG}</em>` : ""}
          ${g.capG > 0 ? '<i class="pg-punto"></i>' : ""}
        </button>`;
      }).join("")}
    </div>
    <dl class="pg-riepilogo">
      <div><dt>Giornate perfette</dt><dd>${s.perfetti} su ${s.giorniAttivi}</dd></div>
      <div><dt>Gettoni guadagnati</dt><dd>${s.fatti}</dd></div>
      <div><dt>Gettoni persi</dt><dd>${s.penalita}</dd></div>
      <div><dt>Paghetta della settimana</dt><dd class="pg-forte">${eur(s.euro)}</dd></div>
    </dl>
    <button class="pg-paga ${pagata ? "fatto" : ""}" data-az="paga" data-d="${s.inizio}">
      ${pagata ? "✓ Paghetta consegnata" : "Segna come consegnata"}</button>
    ${c.storico.length === 0 ? "" : `<div class="pg-storico"><h2>Settimane precedenti</h2>
      ${c.storico.map((x) => `<button class="pg-storico-riga" data-az="vai" data-d="${x.inizio}">
        <span>${breve(x.inizio)} – ${breve(x.fine)}</span>
        <em>${x.netti}/${x.massimo}</em><b>${eur(x.euro)}</b>
        <i class="${dati.paghe[x.inizio] ? "ok" : ""}">${dati.paghe[x.inizio] ? "✓" : "—"}</i>
      </button>`).join("")}</div>`}
  </div>`;
}

function pannelloRegole(c) {
  if (!vista.sbloccato) {
    return `<div class="pg-pannello"><div class="pg-gate">
      <h2>Solo mamma e papà</h2>
      <label>Quanto fa ${QUIZ.a} × ${QUIZ.b}?
        <input type="number" inputmode="numeric" data-az="quiz" /></label>
    </div></div>`;
  }
  const cfg = dati.config;
  const s = c.set;
  return `<div class="pg-pannello">
    <div class="pg-campi">
      <label>Nome
        <input type="text" value="${esc(cfg.nome)}" placeholder="come si chiama" data-cfg="nome" /></label>
      <label>Paghetta della settimana
        <input type="number" min="0" step="0.5" value="${cfg.importoSettimanale}" data-cfg="importoSettimanale" /></label>
      <label>Giorni che contano
        <select data-cfg="giorni">
          <option value="tutti" ${cfg.giorni === "tutti" ? "selected" : ""}>Tutti i giorni</option>
          <option value="feriali" ${cfg.giorni === "feriali" ? "selected" : ""}>Solo dal lunedì al venerdì</option>
        </select></label>
    </div>
    <p class="pg-spiega">Ogni attività conta solo nei giorni che spunti sotto di essa.
      Questa settimana fanno ${s.massimo} gettoni in tutto, e ogni gettone vale ${eur(s.valore)}.
      In un mese sono circa ${eur(Number(cfg.importoSettimanale || 0) * 4.33)}.</p>
    ${editor("Attività", cfg.attivita, "attivita", "+", "es. Rifare il letto")}
    ${editor("Capricci", cfg.capricci, "capricci", "−", "es. Risponde male")}
    <div class="pg-pericolo">
      <p>Per cancellare tutto lo storico, scrivi AZZERA qui accanto.</p>
      <input type="text" data-az="azzera" aria-label="Scrivi AZZERA per cancellare" />
    </div>
    ${vista.rete === "locale" ? "" : `<div class="pg-pericolo">
      <p>Per staccare questo dispositivo e reinserire la parola di famiglia.</p>
      <button class="pg-elimina" style="width:auto;padding:0 14px" data-az="esci">Esci</button>
    </div>`}
  </div>`;
}

function disegna() {
  const app = document.getElementById("app");
  if (!dati) { app.innerHTML = '<p class="pg-boot">Apro il salvadanaio…</p>'; return; }
  const c = calcola();
  const s = c.set;
  const pieno = s.massimo > 0 ? s.netti / s.massimo : 0;
  const spia = vista.rete === "ok" ? "" : vista.rete === "locale" ? " locale" : " giu";
  const titoli = { oggi: "Giornata", settimana: "Settimana", regole: "Regole" };

  app.innerHTML = `
    <header class="pg-testa">
      <h1>${dati.config.nome ? `Il salvadanaio di ${esc(dati.config.nome)}` : "Il salvadanaio"}</h1>
      <p>settimana dal ${breve(s.inizio)} al ${breve(s.fine)}${s.corrente ? "" : s.chiusa ? " · chiusa" : " · prossima"}<span class="pg-stato-rete${spia}"></span></p>
    </header>
    <section class="pg-hero">
      ${barattolo(pieno)}
      <div class="pg-hero-testo">
        <p class="pg-euro">${eur(s.euro)}</p>
        <p class="pg-hero-riga">${gettoniLabel(s.netti)} su ${s.massimo} — un gettone vale ${eur(s.valore)}</p>
        <div class="pg-barra">
          <span style="width:${Math.min(100, pieno * 100)}%"></span>
          <i style="left:${Math.min(100, (s.potenziale / (s.massimo || 1)) * 100)}%"></i>
        </div>
        <p class="pg-hero-nota">${s.chiusa
          ? `Settimana finita: ${dati.paghe[s.inizio] ? "già pagata" : "da pagare"}`
          : `Finendo la settimana senza sbavature: ${eur(s.potenziale * s.valore)}`}${
          s.penalita > 0 ? ` · ${gettoniLabel(s.penalita)} persi per i capricci` : ""}</p>
      </div>
    </section>
    ${vista.avviso ? `<p class="pg-avviso">${esc(vista.avviso)}</p>` : ""}
    <nav class="pg-tab">
      ${Object.keys(titoli).map((k) => `<button class="${vista.tab === k ? "attivo" : ""}"
        data-az="tab" data-k="${k}">${titoli[k]}</button>`).join("")}
    </nav>
    ${vista.tab === "oggi" ? pannelloGiorno(c)
      : vista.tab === "settimana" ? pannelloSettimana(c) : pannelloRegole(c)}`;
}

/* ------------------------------------------------------------------
   6. INTERAZIONI
------------------------------------------------------------------ */
document.getElementById("app").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-az]");
  if (!b || b.tagName === "INPUT") return;
  const az = b.dataset.az;

  if (az === "tab") { vista.tab = b.dataset.k; disegna(); return; }
  if (az === "giorno") { vista.sel = piu(vista.sel, Number(b.dataset.n)); disegna(); return; }
  if (az === "sett") { vista.sel = piu(vista.sel, Number(b.dataset.n)); disegna(); return; }
  if (az === "vai") { vista.sel = b.dataset.d; vista.tab = "oggi"; disegna(); return; }
  if (az === "esci") { localStorage.removeItem(CHIAVE_PASS); location.reload(); return; }

  if (az === "spunta") {
    patchGiorno(vista.sel, (r) => {
      if (r.fatte[b.dataset.id]) delete r.fatte[b.dataset.id];
      else r.fatte[b.dataset.id] = true;
      return r;
    });
    return;
  }
  if (az === "cap") {
    patchGiorno(vista.sel, (r) => {
      const v = (r.capricci[b.dataset.id] || 0) + Number(b.dataset.n);
      if (v > 0) r.capricci[b.dataset.id] = v;
      else delete r.capricci[b.dataset.id];
      return r;
    });
    return;
  }
  if (az === "paga") {
    const paghe = { ...dati.paghe };
    if (paghe[b.dataset.d]) delete paghe[b.dataset.d];
    else paghe[b.dataset.d] = true;
    salva({ ...dati, paghe });
    return;
  }
  if (az === "togli") {
    const campo = b.dataset.campo;
    patchConfig({ [campo]: dati.config[campo].filter((x) => x.id !== b.dataset.id) });
    return;
  }
  if (az === "dow") {
    const id = b.dataset.id;
    const dw = Number(b.dataset.n);
    patchConfig({
      attivita: dati.config.attivita.map((x) => {
        if (x.id !== id) return x;
        const g = giorniDi(x).slice();
        const i = g.indexOf(dw);
        if (i >= 0) g.splice(i, 1); else g.push(dw);
        return { ...x, giorni: g.sort((p, q) => p - q) };
      }),
    });
    return;
  }
  if (az === "aggiungi") {
    const campo = b.dataset.campo;
    patchConfig({ [campo]: [...dati.config[campo], { id: uid(), testo: "", gettoni: 1 }] });
  }
});

document.getElementById("app").addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.az === "quiz") {
    if (Number(el.value) === QUIZ.a * QUIZ.b) { vista.sbloccato = true; disegna(); }
    return;
  }
  if (el.dataset.az === "azzera" && el.value.trim().toUpperCase() === "AZZERA") {
    salva({ config: dati.config, registro: {}, paghe: {} });
  }
});

document.getElementById("app").addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset.cfg) {
    const k = el.dataset.cfg;
    if (k === "importoSettimanale") patchConfig({ importoSettimanale: Math.max(0, Number(el.value) || 0) });
    else if (k === "nome") patchConfig({ nome: el.value.trim() });
    else patchConfig({ [k]: el.value });
    return;
  }
  if (el.dataset.campo) {
    const { campo, id, chiave } = el.dataset;
    const valore = chiave === "gettoni" ? Math.max(1, Number(el.value) || 1) : el.value;
    patchConfig({ [campo]: dati.config[campo].map((x) => (x.id === id ? { ...x, [chiave]: valore } : x)) });
  }
});

/* ------------------------------------------------------------------
   7. AVVIO
------------------------------------------------------------------ */
function chiediParola(errore) {
  document.getElementById("app").innerHTML = `
    <header class="pg-testa"><h1>Il salvadanaio</h1></header>
    <div class="pg-pannello"><div class="pg-gate">
      <h2>Parola di famiglia</h2>
      <label><input type="password" id="pg-pass" autocomplete="off" style="width:220px" /></label>
      <button class="pg-paga" id="pg-entra">Entra</button>
      <p>${errore || "La stessa parola su tutti i dispositivi apre lo stesso salvadanaio. Va scritta una volta sola per dispositivo."}</p>
    </div></div>`;
  const entra = () => {
    const v = document.getElementById("pg-pass").value.trim();
    if (v.length < 4) { chiediParola("Serve una parola di almeno 4 lettere."); return; }
    localStorage.setItem(CHIAVE_PASS, v);
    avvia();
  };
  document.getElementById("pg-entra").addEventListener("click", entra);
  document.getElementById("pg-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") entra(); });
}

async function avvia() {
  const locali = localStorage.getItem(CHIAVE_LOCALE);
  dati = normalizza(locali ? JSON.parse(locali) : null);

  if (!FIREBASE.apiKey) {
    vista.rete = "locale";
    disegna();
    return;
  }

  const parola = localStorage.getItem(CHIAVE_PASS);
  if (!parola) { chiediParola(); return; }

  vista.rete = "giu";
  disegna();

  try {
    const base = `https://www.gstatic.com/firebasejs/${VERSIONE_SDK}`;
    const [{ initializeApp }, { getAuth, signInAnonymously }, fs] = await Promise.all([
      import(`${base}/firebase-app.js`),
      import(`${base}/firebase-auth.js`),
      import(`${base}/firebase-firestore.js`),
    ]);
    const app = initializeApp(FIREBASE);
    await signInAnonymously(getAuth(app));
    const db = fs.getFirestore(app);
    const rif = fs.doc(db, "paghette", await impronta(parola));

    scriviRemoto = (d) => fs.setDoc(rif, d);
    fs.onSnapshot(rif, (istantanea) => {
      vista.rete = "ok";
      if (istantanea.exists()) collega(istantanea.data());
      else { salva(dati); }
      disegna();
    }, () => {
      vista.rete = "giu";
      vista.avviso = "Connessione al salvadanaio condiviso interrotta.";
      disegna();
    });
  } catch (e) {
    vista.rete = "giu";
    vista.avviso = "Non riesco a collegarmi: sto usando i dati di questo dispositivo.";
    disegna();
  }
}

avvia();

</script>
